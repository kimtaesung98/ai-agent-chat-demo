# CI — Node 테스트와 서버 계약 테스트 (SPEC.md F-009 AC4)
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache: false

      - name: Node 단위·통합 테스트
        run: npm test

      - name: Go 정적 검사
        working-directory: server
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...

      - name: 계약 테스트 (Node 서버, 모의 모드)
        run: npm run test:contract
