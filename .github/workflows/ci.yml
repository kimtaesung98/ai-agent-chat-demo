# CI — Node 테스트, Go 테스트, 두 서버에 대한 계약 테스트 (SPEC.md F-009 AC4, F-010)
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache: false

      - name: Node 단위·통합 테스트
        run: npm test

      - name: Go 정적 검사
        working-directory: server
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...

      - name: Go 단위 테스트 · 의존 규칙 (F-010 AC2·AC6)
        working-directory: server
        run: go test ./...

      - name: Go 정적 빌드 (cgo 없음, ADR-007)
        working-directory: server
        run: CGO_ENABLED=0 go build ./cmd/chatd

      - name: 계약 테스트 (Node 서버, 모의 모드)
        run: npm run test:contract

      - name: 계약 테스트 (Go 서버, 모의 모드) (F-010 AC1)
        run: npm run test:contract:go
