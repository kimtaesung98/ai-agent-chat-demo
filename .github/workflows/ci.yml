# CI — Go 테스트·계약 테스트, Flutter 분석·테스트·웹 빌드, 운영 이미지 계약 테스트 (SPEC.md F-009 AC4, F-010, F-011 AC5, F-013, F-014 AC1)
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache: false

      - name: Go 정적 검사
        working-directory: server
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...

      - name: Go 단위 테스트 · 의존 규칙 · 계약 테스트 (F-010 AC2·AC6, F-013 AC2 — 모의 모드 chatd를 직접 띄움)
        working-directory: server
        run: go test ./...

      - name: Go 정적 빌드 (cgo 없음, ADR-007)
        working-directory: server
        run: CGO_ENABLED=0 go build ./cmd/chatd

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable

      - run: flutter pub get

      - name: 정적 분석 (F-011 AC3)
        run: flutter analyze

      - name: 단위·위젯 테스트 · 의존 규칙 (F-011 AC1·AC3)
        run: flutter test

      - name: 웹 빌드 (F-011 AC5, CDN 없이)
        run: flutter build web --no-web-resources-cdn

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: app/build/web
          retention-days: 1

  android:
    # F-017 AC1: 같은 Dart 코드로 Android 앱이 빌드되는지 (러너에 Android SDK가 있음)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable

      - name: Android 디버그 APK 빌드 (F-017 AC1)
        run: flutter build apk --debug

  image:
    needs: flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: app/build/web

      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache: false

      - name: 운영 이미지 빌드 (F-014 AC1)
        run: docker build -t chatd:ci .

      - name: 비root 확인
        run: test "$(docker inspect -f '{{.Config.User}}' chatd:ci)" = "nonroot:nonroot"

      - name: 이미지를 모의 모드로 띄워 계약 테스트 (F-014 AC1)
        run: |
          docker run -d --name chatd -p 3000:3000 --read-only chatd:ci
          for _ in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:3000/ && break; sleep 1; done
          (cd server && go test ./contract -count=1 -base-url=http://127.0.0.1:3000)

      - name: 실패 시 서버 로그
        if: failure()
        run: docker logs chatd || true
