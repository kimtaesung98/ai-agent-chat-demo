# 운영 배포 — 수동 실행 (SPEC F-014 상세 동작 2, ARCHITECTURE ADR-018)
# GitHub OIDC로 AWS 역할을 받아(장기 키 없음) arm64 이미지를 ECR에 올리고, SSM Run Command로 EC2에서 다시 띄운다.
# 필요한 저장소 변수: AWS_REGION, AWS_DEPLOY_ROLE_ARN, ECR_REPOSITORY_URI, EC2_INSTANCE_ID (deploy/provision.sh가 출력)
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter build web --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: app/build/web
          retention-days: 1

  deploy:
    needs: web
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: app/build/web

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드·푸시 (linux/arm64, t4g)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ vars.ECR_REPOSITORY_URI }}:${{ github.sha }}

      - name: EC2에서 다시 띄우기 (SSM Run Command)
        env:
          IMAGE: ${{ vars.ECR_REPOSITORY_URI }}:${{ github.sha }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          script=$(base64 -w0 deploy/run-chatd.sh)
          params=$(jq -nc --arg s "$script" --arg img "$IMAGE" \
            '{commands: ["echo \($s) | base64 -d > /tmp/run-chatd.sh", "IMAGE=\($img) bash /tmp/run-chatd.sh"]}')
          id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" --parameters "$params" --query Command.CommandId --output text)
          echo "SSM 명령 $id"
          aws ssm wait command-executed --command-id "$id" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[Status, StandardOutputContent, StandardErrorContent]' --output text
          test "$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --query Status --output text)" = Success
